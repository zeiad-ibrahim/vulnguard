<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnGuard - Scan History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/history.css') }}">
</head>
<body>
    <nav class="navbar">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="VulnGuard Logo" class="logo">
        <h1 class="brand-name">Scan History</h1>
        <a href="{{ url_for('mainpage') }}" class="back-btn">Back to Dashboard</a>
    </nav>

    <main>
        <h2>Previous Scans</h2>
        <div class="history-table">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>IP Address</th>
                        <th>Scan Type</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="scanHistoryTable">
                    <!-- Scan history will be dynamically populated here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="{{ url_for('static', filename='styles/history.js') }}"></script>
</body>
</html>
